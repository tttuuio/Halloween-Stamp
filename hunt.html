<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>おばけを探す！ | HALLOWEEN GHOST HUNT</title>

    <!-- Kaisei Decol -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@400;500;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <div class="app">

        <!-- ヘッダー -->

        <header class="header">

            <div class="club-name">
                デジタルクリエイト部
            </div>

        </header>


        <!-- =================================
             おばけを探すページ
        ================================= -->

        <main class="hunt">

            <div class="hunt-content">

                <!-- タイトル -->

                <h1 class="hunt-title">
                    おばけを探そう！
                </h1>


                <p class="hunt-description">
                    校内に逃げたおばけを見つけたら、<br>
                    その場所にある「合言葉」を入力しよう！
                </p>


                <!-- 進行状況 -->

                <div class="progress">

                    <span class="progress-ghost">
                        👻
                    </span>

                    <div class="progress-count" id="topProgress">0 / 6</div>


                </div>


                <!-- 合言葉 -->

                <div class="keyword-box">

                    <label for="keyword">
                        🔑 合言葉を入力
                    </label>

                    <input
                        type="text"
                        id="keyword"
                        placeholder="合言葉を入力してください"
                        autocomplete="off"
                    >

                    <button class="keyword-button" id="keywordButton">
                        入力
                        <span>›</span>
                    </button>

                    <div class="result" id="result"></div>

                </div>


                <!-- 戻る -->

                <button class="back-button"
                        onclick="location.href='index.html'">
                    ‹ トップへ戻る
                </button>

            </div>

        </main>



    <script type="module" src="js/firebase.js"></script>
    <script src="js/main.js"></script>

</body>

</html>
