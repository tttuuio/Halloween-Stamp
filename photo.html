
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>お化けと写真 | HALLOWEEN GHOST HUNT</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .photo-page {
      max-width: 600px;
      margin: auto;
      padding: 20px;
      color: white;
      text-align: center;
    }

    .camera-area {
      position: relative;
      overflow: hidden;
      width: 100%;
      aspect-ratio: 3 / 4;
      background: #120027;
      border-radius: 16px;
    }

    #camera {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #ghostOverlay {
      position: absolute;
      left: 35%;
      top: 35%;
      width: 30%;
      touch-action: none;
      user-select: none;
      -webkit-user-drag: none;
      cursor: grab;
    }

    .photo-page button,
    .photo-page select,
    .photo-page a {
      margin: 8px 4px;
      padding: 12px;
      border-radius: 10px;
      font-size: 16px;
    }

    #photoPreview {
      display: block;
      max-width: 100%;
      margin: 16px auto;
      border-radius: 12px;
    }

    .photo-help {
      font-size: 14px;
      line-height: 1.7;
    }

    #savePhoto {
      color: #ffad33;
      font-weight: bold;
      border: 2px solid #ffad33;
      display: inline-block;
      text-decoration: none;
      background: #21004d;
    }
  </style>
</head>
<body>
  <main class="photo-page">
    <h1>👻 お化けと写真を撮ろう！</h1>
    <p class="photo-help">
      集めたお化けと記念撮影！<br>
      カメラ映像は撮影処理をこの端末内で行い、
      サーバーには送信しません。
    </p>

    <label for="ghostSelect">お化けを選ぼう</label><br>
    <select id="ghostSelect">
      <option value="">読み込み中...</option>
    </select>

    <div class="camera-area">
      <video id="camera" autoplay playsinline muted></video>
      <img id="ghostOverlay" alt="選んだお化け" hidden>
    </div>

    <p class="photo-help">
      お化けをドラッグして移動できるよ！<br>
      下のボタンで大きさも変えられるよ。
    </p>

    <div class="size-controls">
      <button type="button" id="shrinkGhost">➖ 小さく</button>
      <button type="button" id="enlargeGhost">➕ 大きく</button>
    </div>
    
    <button id="startCamera">📷 カメラを起動</button>
    <button id="takePhoto" disabled>✨ 撮影する</button>

    <div id="message" role="status"></div>

    <section id="result" hidden>
      <h2>撮影できたよ！</h2>
      <img id="photoPreview" alt="撮影した写真">
      <p class="photo-help">
        スマホでは写真を長押しして「写真に保存」などを選んでね。
        下のボタンからファイルとして保存できる場合もあるよ。
      </p>
      <a id="savePhoto" download="ghost-hunt.png">写真をダウンロード</a>
    </section>

    <button onclick="location.href='encyclopedia.html'">
      📖 お化け図鑑へ戻る
    </button>
  </main>

  <script src="js/photo.js"></script>
</body>
</html>
